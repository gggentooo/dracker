# File:         ci/macos.yml
# Phase:        Phase 0.1 — CI Workflow & Headless Quality Gates
#
# Purpose:
#   Automated macOS CI pipeline running headless unit tests, rt_malloc_trap
#   allocation audits, golden WAV regression checks, and app build compilation.
#   Live hardware CoreAudio/CoreMIDI/Metal rendering audits run locally on
#   developer machines (GitHub Actions macOS runners lack audio hardware/GPU).
#
# Dependencies:
#   LDC2 1.40+, DUB, Xcode Command Line Tools / Metal toolchain (for app config).

name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  headless-test-and-build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: dracker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LDC2 and DUB
        run: |
          brew update
          brew install ldc
          ldc2 --version
          dub --version

      - name: Verify audio-formats Boost subconfiguration
        run: |
          dub describe --compiler=ldc2 --config=headless > /tmp/dub-describe.json
          head -n 60 /tmp/dub-describe.json
          grep -q '"rootConfiguration": "boost"' /tmp/dub-describe.json

      - name: Build dracker-compose binary before headless tests
        run: dub build --compiler=ldc2 --config=compose

      - name: Run headless tests (unit, bundled presets, rt_malloc_trap, golden WAV, end-to-end, fuzz smoke)
        run: dub test --compiler=ldc2 --config=headless

      - name: Verify headless release build
        run: dub build --compiler=ldc2 --config=headless --build=release

      - name: Run dracker-compose CLI end-to-end verification
        run: |
          ./build/dracker-compose help > /dev/null
          ./build/dracker-compose --json help | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and len(d["subcommands"]) == 6'
          ./build/dracker-compose --json catalog | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and len(d["modules"]) >= 30 and len(d["presets"]) == 16'
          python3 - <<'PY'
          src = open("sample-projects/neon_drift.dcs", "r", encoding="utf-8").read()
          src = src.replace("sample-projects/neon_drift_lead.msym", "/tmp/ci-neon-lead.msym")
          src = src.replace("sample-projects/neon_drift.msv", "/tmp/ci-neon.msv")
          open("/tmp/ci-neon.dcs", "w", encoding="utf-8").write(src)
          PY
          rm -f /tmp/ci-neon-lead.msym /tmp/ci-neon.msv /tmp/ci-neon.wav /tmp/ci-neon-desc.dcs /tmp/ci-neon-rt.msv
          ./build/dracker-compose --json check /tmp/ci-neon.dcs | python3 -c 'import json,sys,os; d=json.load(sys.stdin); assert d["ok"] and not os.path.exists("/tmp/ci-neon.msv") and not os.path.exists("/tmp/ci-neon-lead.msym")'
          ./build/dracker-compose --json run /tmp/ci-neon.dcs | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and len(d["written"]) == 2'
          ./build/dracker-compose --json render /tmp/ci-neon.msv -o /tmp/ci-neon.wav | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and len(d["silentBars"]) == 0 and not d["limiterReached"] and d["arrangementBars"] == 16'
          ./build/dracker-compose --json describe /tmp/ci-neon.msv > /tmp/ci-neon-desc.json
          python3 -c 'import json; d=json.load(open("/tmp/ci-neon-desc.json")); assert d["ok"] and d["kind"] == "project"; open("/tmp/ci-neon-desc.dcs", "w", encoding="utf-8").write(d["script"])'
          ./build/dracker-compose --json check /tmp/ci-neon-desc.dcs | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"]'
          ./build/dracker-compose --json run /tmp/ci-neon-desc.dcs -o /tmp/ci-neon-rt.msv | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"]'
          cmp -s /tmp/ci-neon.msv /tmp/ci-neon-rt.msv
          rm -f /tmp/ci-neon.dcs /tmp/ci-neon-lead.msym /tmp/ci-neon.msv /tmp/ci-neon.wav /tmp/ci-neon-desc.json /tmp/ci-neon-desc.dcs /tmp/ci-neon-rt.msv
          set +e
          ./build/dracker-compose check /tmp/no-such-script.dcs
          missing=$?
          ./build/dracker-compose frobnicate
          usage=$?
          set -e
          test "$missing" -eq 1
          test "$usage" -eq 2

      - name: Verify the task list (docs/todo.md is generated from docs/todo.json)
        run: python3 tools/todo.py check

      - name: Verify standalone x86_64 foundation cross-compile and macOS tooling lints
        run: |
          ldc2 -mtriple=x86_64-apple-macos12.0 -w -c -o- -Isource source/foundation/types.d source/foundation/memory.d source/foundation/concurrency.d source/foundation/math_rt.d
          clang -x objective-c -fobjc-arc -mmacosx-version-min=12.0 -fsyntax-only -Wall -Wextra source/platform/macos/objc_blocks_shim.m
          plutil -lint packaging/macos/Info.plist packaging/macos/entitlements.plist
          bash -n packaging/macos/bundle_macos.sh
          while IFS='|' read -r preset_name preset_group; do
            [[ -z "${preset_name}" ]] && continue
            [[ -s "resources/presets/${preset_group}/${preset_name}.msym" ]]
          done < <(sed -nE 's/^[[:space:]]*FactoryPreset\("([^"]+)",[[:space:]]*"([^"]+)".*/\1|\2/p' source/app/factory_presets.d)

      - name: Verify full app configuration compilation (when Metal toolchain available)
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            dub build --compiler=ldc2 --config=app --build=debug
          else
            echo "Metal toolchain unavailable on runner; skipping app shader compile."
          fi
